<style>
  :root{
    --bg-top:#0f1c2e;
    --bg-bottom:#16324f;
    --card:rgba(255,255,255,0.06);
    --card-hover:rgba(255,255,255,0.12);
    --border:rgba(255,255,255,0.14);
    --text:#f4f7fb;
    --muted:#a9bacd;
    --accent:#4fb3ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:linear-gradient(160deg,var(--bg-top),var(--bg-bottom) 60%, #10233a 100%);
    color:var(--text);
    font-family:"Ubuntu",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    display:flex;
    justify-content:center;
    padding:56px 16px 64px;
  }
  .wrap{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.25);
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  h1{
    margin:20px 0 4px;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .tagline{
    margin:0 0 8px;
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    max-width:340px;
  }
  .role{
    margin:0 0 28px;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1.2px;
  }
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    transition:background .18s ease, transform .18s ease, border-color .18s ease;
    backdrop-filter:blur(6px);
  }
  a.link:hover{
    background:var(--card-hover);
    border-color:rgba(255,255,255,0.3);
    transform:translateY(-2px);
  }
  a.link:active{
    transform:translateY(0px) scale(0.99);
  }
  .icon{
    flex:0 0 auto;
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{
    width:22px;
    height:22px;
    fill:currentColor;
  }
  .label{flex:1 1 auto; text-align:left;}
  .arrow{
    flex:0 0 auto;
    color:var(--muted);
    font-size:18px;
  }
  .cv .icon{color:#ffb648;}
  .linkedin .icon{color:#4fb3ff;}
  .facebook .icon{color:#7fa8ff;}
  .x .icon{color:#e9edf3;}
  .whatsapp .icon{color:#5fe08a;}
  .calendar .icon{color:#ff8fb4;}
  .email .icon{color:#c9b8ff;}

  footer{
    margin-top:40px;
    color:rgba(255,255,255,0.35);
    font-size:12px;
  }

  @media (max-width:400px){
    a.link{padding:14px 16px; font-size:15px;}
    h1{font-size:23px;}
  }
</style>
